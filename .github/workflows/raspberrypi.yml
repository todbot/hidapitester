name: raspberrypi

on: [push, pull_request, workflow_dispatch]

env:
  HIDAPI_VERSION: "0.15.0"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: hidapitester
          # tags needed for the version string; default depth-1 has none
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: libusb/hidapi
          ref: hidapi-${{ env.HIDAPI_VERSION }}
          path: hidapi
      # git in the emulated image can't be relied on, so resolve the tag here
      - name: record version for the Pi image
        run: git -C hidapitester describe --tags --abbrev=0 --match 'v*' > hidapitester/.git-tag || true

      - uses: pguyot/arm-runner-action@v2
        with:
          base_image: raspios_lite_arm64:latest
          cpu: cortex-a53
          #base_image: raspios_lite:latest
          #cpu: cortex-a7
          copy_artifact_path: artifacts
          commands: |
            apt-get update
            apt-get install -y libudev-dev pkg-config build-essential
            cd hidapitester
            make
            make package
            mkdir -p ../artifacts
            cp *.zip ../artifacts/
            ls -la ../artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: hidapitester-raspberrypi
          path: artifacts/*.zip


      - name: Attach zips to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          # Draft until all four platform workflows have attached their zip
          draft: true
          fail_on_unmatched_files: true
          files: artifacts/*.zip
